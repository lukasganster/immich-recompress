@if (show) {
  <div class="bulkbar">
    <strong>{{ n }} {{ noun }} selected</strong>
    <button class="link" (click)="clearSelection.emit()">Clear</button>
    <span class="spacer"></span>
    <button class="btn ghost" (click)="downloadSelected.emit()">Download {{ n }}</button>
    <button class="btn primary" (click)="encodeSelected.emit([...store.selected()])">
      {{ actionLabel }} {{ n }}
    </button>
  </div>
}
