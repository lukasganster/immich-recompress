<header class="rail">
  <img class="logo" src="logo.png" alt="" />
  <h1 class="wordmark">Immich Recompress</h1>

  <span class="sep"></span>

  <button class="btn" (click)="browseClick.emit()">Select media</button>

  <span class="header-spacer"></span>

  <span class="deps">
    <span class="pill" [class.bad]="!store.handbrake()" title="HandBrakeCLI">HandBrakeCLI</span>
    <span class="pill" [class.bad]="!store.ffprobe()" title="ffprobe">ffprobe</span>
    <span class="pill" [class.bad]="!store.ffmpeg()" title="ffmpeg">ffmpeg</span>
  </span>

  <span class="sep"></span>

  <span class="pill plain" [class.bad]="!store.immichUrl()">
    <span class="label-url">Immich</span>
    {{ store.immichUrl() || 'not connected' }}
    @if (store.immichVersion()) { <span class="label-url">v{{ store.immichVersion() }}</span> }
  </span>
</header>
